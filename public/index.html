<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Produtos - MongoDB Atlas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .input-box {
            margin-bottom: 10px;
        }

        input {
            padding: 10px;
            width: 250px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            background-color: #2ecc71;
            border: none;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #27ae60;
        }

        .produto {
            padding: 12px;
            background: white;
            margin-top: 10px;
            border-left: 4px solid #2ecc71;
        }
    </style>
</head>
<body>

    <h1>Cadastro de Produtos</h1>

    <div class="input-box">
        <input type="text" id="nome" placeholder="Nome do produto">
    </div>

    <div class="input-box">
        <input type="number" id="preco" placeholder="Preço">
    </div>

    <button onclick="adicionar()">Adicionar Produto</button>

    <h2>Lista de produtos</h2>
    <div id="lista"></div>

    <script>
        // 🔥 SEU DOMÍNIO DO RAILWAY:
        const API = "https://mongo-production-68e0.up.railway.app";

        // ---------- LISTAR ----------
        async function listar() {
            const req = await fetch(API + "/listar");
            const dados = await req.json();

            const lista = document.getElementById("lista");
            lista.innerHTML = "";

            dados.forEach(produto => {
                lista.innerHTML += `
                    <div class="produto">
                        <strong>${produto.nome}</strong><br>
                        Preço: R$ ${produto.preco}
                    </div>
                `;
            });
        }

        // ---------- ADICIONAR ----------
        async function adicionar() {
            const nome = document.getElementById("nome").value;
            const preco = Number(document.getElementById("preco").value);

            if (!nome || preco <= 0) {
                alert("Preencha os campos corretamente.");
                return;
            }

            await fetch(API + "/adicionar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nome, preco })
            });

            document.getElementById("nome").value = "";
            document.getElementById("preco").value = "";

            listar(); // Atualiza a lista
        }

        // Carregar ao iniciar
        listar();
    </script>

</body>
</html>
