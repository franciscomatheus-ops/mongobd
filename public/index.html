<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Produtos - MongoDB Atlas</title>
    <style>
        body {
            font-family: Arial;
            background: #f7f7f7;
            padding: 20px;
        }
        h1 { color: #333; }
        input, button {
            padding: 10px;
            margin: 5px 0;
        }
        button {
            cursor: pointer;
        }
        .produto {
            background: white;
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #2ecc71;
        }
    </style>
</head>
<body>

    <h1>Cadastro de Produtos</h1>

    <input type="text" id="nome" placeholder="Nome do produto"><br>
    <input type="number" id="preco" placeholder="Preço"><br>

    <button onclick="adicionarProduto()">Adicionar</button>

    <h2>Produtos cadastrados</h2>
    <div id="lista"></div>

    <script>
        const API = "https://mongo-production-68e0.up.railway.app/"; // 🔥 Trocar se necessário

        // Listar produtos ao carregar a página
        async function listar() {
            const res = await fetch(API + "/listar");
            const dados = await res.json();

            const lista = document.getElementById("lista");
            lista.innerHTML = "";

            dados.forEach(p => {
                lista.innerHTML += `
                    <div class="produto">
                        <strong>${p.nome || "Sem nome"}</strong><br>
                        Preço: R$ ${p.preco || 0}
                    </div>
                `;
            });
        }

        // Adicionar produto
        async function adicionarProduto() {
            const nome = document.getElementById("nome").value;
            const preco = Number(document.getElementById("preco").value);

            await fetch(API + "/adicionar", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ nome, preco })
            });

            alert("Produto adicionado!");
            listar();
        }

        listar();
    </script>

</body>
</html>
